name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Run test suite
        run: pnpm run test

      - name: Verify package invariants
        run: |
          cd packages/adapters/omniroute-native
          node test/load-path.verify.mjs
          node test/ui-parser.verify.mjs

      - name: Anti-leak prevention check
        run: |
          bash scripts/check-anti-leak.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Run Python offline test suites
        run: |
          python3 -m unittest discover -s bench -q
          python3 -m unittest discover -s deploy/tests -q
